# Development / testing only. The credentials below are throw-away local values and must never
# be reused anywhere else. Production secrets come from the deployment platform.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: property_management
    ports:
      # Bound to loopback so the development database is not exposed on the network.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d property_management"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    # Building the image requires the BuildKit secrets described in docs/DEVELOPMENT.md.
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/property_management?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in your shell}
      NEXTAUTH_URL: http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
