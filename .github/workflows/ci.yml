name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: property_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d property_management"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/property_management?schema=public
      AUTH_SECRET: ci-only-secret-that-is-long-enough-for-validation-12345
      NEXTAUTH_URL: http://localhost:3000
      INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Lint
        run: |
          # Surface ESLint errors as annotations so they are readable from the checks API.
          npx eslint -f json -o eslint-report.json || true
          node -e "const r=require('./eslint-report.json');for(const f of r)for(const m of f.messages)if(m.severity===2)console.log('::error file='+f.filePath.replace(process.cwd()+'/','')+',line='+m.line+'::'+m.ruleId+': '+m.message)"
          npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Build Docker image
        run: docker build --secret id=database_url,env=DATABASE_URL --secret id=auth_secret,env=AUTH_SECRET --tag property-management-platform:ci .

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/property_management?schema=public
      AUTH_SECRET: ci-only-secret-that-is-long-enough-for-validation-12345
      NEXTAUTH_URL: http://127.0.0.1:3000
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: property_management
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium
      # The suite runs against the production build (standalone server), like the Docker image does.
      - run: npm run build
      - name: Prepare standalone server
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
      - name: E2E tests
        run: npm run test:e2e
        env:
          E2E_SERVER_COMMAND: node .next/standalone/server.js
          PORT: "3000"
          HOSTNAME: 127.0.0.1
          # Auth.js refuses unknown hosts in production unless told to trust the configured one.
          AUTH_TRUST_HOST: "true"
